openapi: 3.0.3
info:
  title: Answer with Books API
  version: 0.1.2
  description: REST API for retrieving book-grounded published answers, source books, and captured new questions.
servers:
  - url: http://127.0.0.1:8787
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /v1/sources:
    get:
      summary: List source toggles
      responses:
        '200':
          description: Sources
  /v1/sources/toggle:
    post:
      summary: Enable selected sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: array
                  items:
                    type: string
                    enum: [books, crowdlisten, top_of_mind, clicked_questions]
      responses:
        '200':
          description: Updated source state
  /v1/books:
    get:
      summary: List books
      responses:
        '200':
          description: Book source records
    post:
      summary: Add a book source record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, author]
              properties:
                id:
                  type: string
                title:
                  type: string
                author:
                  type: string
                concepts:
                  type: array
                  items:
                    type: string
                quotes:
                  type: array
                  items:
                    type: string
                applications:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Created book
  /v1/books/retrieve:
    post:
      summary: Retrieve relevant books or create a missing catalog record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                question:
                  type: string
                title:
                  type: string
                limit:
                  type: integer
                min_score:
                  type: integer
                create_if_missing:
                  type: boolean
                book:
                  type: object
                  required: [title, author]
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    author:
                      type: string
                    concepts:
                      type: array
                      items:
                        type: string
                    quotes:
                      type: array
                      items:
                        type: string
                    applications:
                      type: array
                      items:
                        type: string
      responses:
        '200':
          description: Book retrieval hit or miss
        '201':
          description: Missing book created
  /v1/questions:
    get:
      summary: List captured questions
      responses:
        '200':
          description: Questions
    post:
      summary: Capture a user question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                sources:
                  type: array
                  items:
                    type: string
                clicked:
                  type: boolean
                context:
                  type: string
      responses:
        '201':
          description: Captured question
  /v1/concerns:
    get:
      summary: List demand concerns
      responses:
        '200':
          description: Demand concerns synced from CrowdListen or local fixtures
  /v1/concerns/sync:
    post:
      summary: Ingest enriched concern objects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concerns]
              properties:
                concerns:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Created or updated concerns
  /v1/signals/top-of-mind:
    post:
      summary: Add top-of-mind demand signals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Created signals
  /v1/signals/clicked-question:
    post:
      summary: Add clicked-question signal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                user_id:
                  type: string
      responses:
        '201':
          description: Created signal
  /v1/crowdlisten/sync:
    post:
      summary: Ingest CrowdListen demand packets, concerns, insights, questions, and signals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                demand_packets:
                  type: array
                  items:
                    type: object
                concerns:
                  type: array
                  items:
                    type: object
                insights:
                  type: array
                  items:
                    type: object
                signals:
                  type: array
                  items: {}
                questions:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Created demand signals and concerns
  /v1/content:
    get:
      summary: List generated drafts
      responses:
        '200':
          description: Generated content drafts
  /v1/ask:
    post:
      summary: Ask the shelf by retrieving published answers, relevant books, or capturing a new question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                top_of_mind:
                  type: array
                  items:
                    type: string
                sources:
                  type: array
                  items:
                    type: string
                limit:
                  type: integer
                answer_min_score:
                  type: integer
                book_limit:
                  type: integer
                book_min_score:
                  type: integer
                capture_hit:
                  type: boolean
                compact:
                  type: boolean
                  description: Return only the agent-facing books, answers, and new_question buckets.
      responses:
        '200':
          description: Existing published answer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '201':
          description: New question captured with relevant books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
  /v1/content/generate:
    post:
      summary: Generate a book-grounded content draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question_id:
                  type: string
                question:
                  type: string
                concern_id:
                  type: string
                sources:
                  type: array
                  items:
                    type: string
                format:
                  type: string
                  enum: [article, brief, script, card]
                audience:
                  type: string
      responses:
        '201':
          description: Generated content draft
  /v1/answers/query:
    post:
      summary: Retrieve similar answers or generate and cache on miss
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question_id:
                  type: string
                question:
                  type: string
                sources:
                  type: array
                  items:
                    type: string
                generate_if_missing:
                  type: boolean
                  default: true
                limit:
                  type: integer
                min_score:
                  type: integer
                book_limit:
                  type: integer
                book_min_score:
                  type: integer
                format:
                  type: string
                  enum: [article, brief, script, card]
                audience:
                  type: string
      responses:
        '200':
          description: Similar answer found or cache miss returned
        '201':
          description: New answer generated and cached
components:
  schemas:
    AskResponse:
      type: object
      required: [status, question, objects, next_step]
      properties:
        status:
          type: string
          enum: [hit, new_question]
        question:
          type: string
        next_step:
          type: string
          enum:
            - adapt_existing_answer_with_books
            - answer_from_books_and_save_question
            - save_question_and_request_source_books
        objects:
          type: object
          required: [books, answers, new_question]
          properties:
            books:
              type: array
              items:
                type: object
            answers:
              type: array
              items:
                type: object
            new_question:
              nullable: true
              type: object
