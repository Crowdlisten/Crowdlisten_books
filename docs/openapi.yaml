openapi: 3.0.3
info:
  title: Answer with Books
  version: 0.1.3
  description: English lexical retrieval over public editorial digests. Queries are not saved by default. Operator storage is single-owner, not multi-user.
servers:
  - url: http://127.0.0.1:8787
components:
  securitySchemes:
    OperatorToken:
      type: http
      scheme: bearer
      description: Server-configured AWB_ADMIN_TOKEN, at least 24 characters.
  schemas:
    Ask:
      type: object
      required: [question]
      properties:
        question: {type: string, minLength: 1, maxLength: 2000}
        compact: {type: boolean, default: false}
        capture: {type: boolean, default: false, description: Requires operator authorization when true.}
        sources:
          type: array
          items: {type: string, enum: [books, crowdlisten, top_of_mind, clicked_questions]}
        top_of_mind:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 500}
paths:
  /health:
    get:
      responses:
        '200': {description: Version and English retrieval support}
  /v1/ask:
    post:
      summary: Retrieve published answers and books without generating or saving a question
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Ask'}
      responses:
        '200': {description: 'hit, with objects.books, objects.answers and null new_question'}
        '201': {description: 'new_question with saved=false, no strong published answer; book matches may also be empty'}
        '400': {description: Invalid input or malformed JSON}
        '403': {description: Unauthorized capture request}
        '413': {description: Request exceeds 64 KB}
  /v1/answers/query:
    post:
      deprecated: true
      summary: Compatibility alias for /v1/ask with the same relevance floor and response shape
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Ask'}
      responses:
        '200': {description: Published match}
        '201': {description: Unsaved miss; no draft generation}
        '400': {description: Invalid request}
  /v1/books:
    get:
      responses:
        '200': {description: Public book catalog}
    post:
      security: [{OperatorToken: []}]
      responses:
        '201': {description: Operator-added catalog entry}
        '403': {description: Unauthorized}
  /v1/books/retrieve:
    post:
      summary: Retrieve books; creating a missing book requires operator authorization
      responses:
        '200': {description: hit or miss with matches}
        '400': {description: Invalid query or source IDs}
  /v1/sources:
    get:
      responses:
        '200': {description: Current source toggles}
  /v1/sources/toggle:
    post:
      security: [{OperatorToken: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: array
                  minItems: 1
                  items: {type: string, enum: [books, crowdlisten, top_of_mind, clicked_questions]}
      responses:
        '200': {description: Updated toggles}
        '400': {description: Unknown IDs; state unchanged}
        '403': {description: Unauthorized}
  /v1/questions:
    get:
      security: [{OperatorToken: []}]
      responses:
        '200': {description: Operator-owned queue}
        '403': {description: Unauthorized}
    post:
      security: [{OperatorToken: []}]
      responses:
        '201': {description: Explicitly captured operator question}
        '403': {description: Unauthorized}
  /v1/signals/top-of-mind:
    post:
      security: [{OperatorToken: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: {type: array, minItems: 1, items: {type: string}}
            example: {items: ['Improve customer interviews']}
      responses:
        '201': {description: Operator signals stored}
        '400': {description: Missing items array}
        '403': {description: Unauthorized}
  /v1/signals/clicked-question:
    post:
      security: [{OperatorToken: []}]
      responses:
        '201': {description: Explicit operator signal stored}
        '403': {description: Unauthorized}
  /v1/content/generate:
    post:
      security: [{OperatorToken: []}]
      deprecated: true
      responses:
        '410': {description: Template generation retired}
        '403': {description: Unauthorized}
